name: Build

# Every push to main builds the app on each platform it targets, so a change
# that only compiles on the machine it was written on is caught here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.2"
  # The NNUE weights come from the Pikafish release that matches the pinned
  # submodule. Set this repository variable only to build against a different
  # network on purpose.
  PIKAFISH_NNUE_URL: ${{ vars.PIKAFISH_NNUE_URL }}

jobs:
  test:
    name: Analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Cache the NNUE weights
        uses: actions/cache@v6
        with:
          path: app/assets/pikafish.nnue
          key: nnue-${{ hashFiles('scripts/ci_prepare_nnue.sh') }}
      - run: ./scripts/ci_prepare_nnue.sh
      - run: flutter pub get
        working-directory: app
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Cache the NNUE weights
        uses: actions/cache@v6
        with:
          path: app/assets/pikafish.nnue
          key: nnue-${{ hashFiles('scripts/ci_prepare_nnue.sh') }}
      - run: ./scripts/ci_prepare_nnue.sh
      # The desktop app drives Pikafish as a subprocess, so the bundle needs
      # the real executable; Xcode's copy phase expects it at macos/engine.
      - name: Build the Pikafish executable
        run: ./build_pikafish.sh macos-exe
      - run: flutter pub get
        working-directory: app
      - run: flutter build macos --debug
        working-directory: app
      - uses: actions/upload-artifact@v7
        with:
          name: pikaboard-macos
          path: app/build/macos/Build/Products/Debug/*.app
          retention-days: 7

  ios:
    name: iOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          # Pikafish is compiled from source into a static library the app
          # links, so its sources have to be here.
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Cache the NNUE weights
        uses: actions/cache@v6
        with:
          path: app/assets/pikafish.nnue
          key: nnue-${{ hashFiles('scripts/ci_prepare_nnue.sh') }}
      - run: ./scripts/ci_prepare_nnue.sh
      # Mobile reaches the engine through FFI rather than a subprocess, so the
      # engine and its bridge are linked in as build/ios-arm64/libpikafish.a —
      # named in ios/Flutter/Pikafish.xcconfig, and an Xcode input file, so the
      # app cannot link without it.
      - name: Build the Pikafish static library
        run: ./build_pikafish.sh ios
      - run: flutter pub get
        working-directory: app
      - run: flutter build ios --no-codesign --debug
        working-directory: app
      - uses: actions/upload-artifact@v7
        with:
          name: pikaboard-ios
          # Unsigned, so it installs on a simulator or a jailbroken device
          # only; signing happens at distribution time.
          path: app/build/ios/iphoneos/Runner.app
          retention-days: 7

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Cache the NNUE weights
        uses: actions/cache@v6
        with:
          path: app/assets/pikafish.nnue
          key: nnue-${{ hashFiles('scripts/ci_prepare_nnue.sh') }}
      - run: ./scripts/ci_prepare_nnue.sh
      - run: flutter pub get
        working-directory: app
      # Note: the engine is not yet compiled for Android, so this proves the
      # app builds, not that it can analyse. See issue #8.
      - run: flutter build apk --debug
        working-directory: app
      - uses: actions/upload-artifact@v7
        with:
          name: pikaboard-android
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Cache the NNUE weights
        uses: actions/cache@v6
        with:
          path: app/assets/pikafish.nnue
          key: nnue-${{ hashFiles('scripts/ci_prepare_nnue.sh') }}
      - run: ./scripts/ci_prepare_nnue.sh
      - run: flutter pub get
        working-directory: app
      - run: flutter build linux --debug
        working-directory: app
      # The engine is a separate executable the app spawns, so build it too and
      # keep it with the bundle.
      - name: Build the Pikafish executable
        run: |
          make -C Pikafish/src -j build ARCH=x86-64-avx2 COMP=gcc
          cp Pikafish/src/pikafish app/build/linux/x64/debug/bundle/pikafish
      - uses: actions/upload-artifact@v7
        with:
          name: pikaboard-linux
          path: app/build/linux/x64/debug/bundle
          retention-days: 7

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Cache the NNUE weights
        uses: actions/cache@v6
        with:
          path: app/assets/pikafish.nnue
          key: nnue-${{ hashFiles('scripts/ci_prepare_nnue.sh') }}
      - name: Prepare the NNUE
        shell: bash
        run: ./scripts/ci_prepare_nnue.sh
      - run: flutter pub get
        working-directory: app
      # The Pikafish executable is not built here: the app spawns it at run
      # time, so its absence does not stop the build.
      - run: flutter build windows --debug
        working-directory: app
      - uses: actions/upload-artifact@v7
        with:
          name: pikaboard-windows
          path: app/build/windows/x64/runner/Debug
          retention-days: 7
